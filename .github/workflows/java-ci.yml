name: Java CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v5 # Actualizado a v5

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v5 # Actualizado a v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: 'proyecto-prueba/pom.xml'

    - name: Compilar y ejecutar pruebas (Maven)
      run: |
        cd proyecto-prueba
        mvn -B test
